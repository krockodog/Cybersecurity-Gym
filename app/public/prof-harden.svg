<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="hBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a0e1f"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="hShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="hBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="hGlowF">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hCircle"><circle cx="256" cy="256" r="250"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#hBg)"/>
  <!-- Fortress wall layers -->
  <g opacity="0.12" clip-path="url(#hCircle)">
    <!-- Wall layer 1 -->
    <rect x="40" y="350" width="432" height="120" fill="none" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="40" y="350" width="50" height="20" fill="#1e40af" opacity="0.3"/>
    <rect x="130" y="350" width="50" height="20" fill="#1e40af" opacity="0.3"/>
    <rect x="220" y="350" width="50" height="20" fill="#1e40af" opacity="0.3"/>
    <rect x="310" y="350" width="50" height="20" fill="#1e40af" opacity="0.3"/>
    <rect x="400" y="350" width="50" height="20" fill="#1e40af" opacity="0.3"/>
    <!-- Wall layer 2 -->
    <rect x="70" y="300" width="372" height="50" fill="none" stroke="#1e40af" stroke-width="1"/>
    <!-- Wall layer 3 -->
    <rect x="100" y="260" width="312" height="40" fill="none" stroke="#1e40af" stroke-width="0.8"/>
  </g>
  <!-- Shield shape behind head -->
  <g filter="url(#hBlur)" opacity="0.15">
    <path d="M256,80 L360,140 L360,280 L256,360 L152,280 L152,140Z" fill="#1e40af"/>
  </g>
  <path d="M256,90 L350,145 L350,275 L256,350 L162,275 L162,145Z" fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.25"/>
  <path d="M256,110 L330,155 L330,260 L256,325 L182,260 L182,155Z" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.15"/>
  <!-- Geometric defensive pattern - hex grid -->
  <g opacity="0.08">
    <polygon points="256,60 280,74 280,102 256,116 232,102 232,74" fill="none" stroke="#1e40af" stroke-width="1"/>
    <polygon points="208,80 232,94 232,122 208,136 184,122 184,94" fill="none" stroke="#1e40af" stroke-width="1"/>
    <polygon points="304,80 328,94 328,122 304,136 280,122 280,94" fill="none" stroke="#1e40af" stroke-width="1"/>
  </g>
  <!-- Head silhouette - military, structured -->
  <g>
    <!-- Flat top / military cut -->
    <path d="M215,140 L297,140 L305,150 L310,170 L315,200 L318,240 L312,270 L300,295 L290,315 L280,340 L278,380 L256,400 L234,380 L232,340 L222,315 L212,295 L200,270 L194,240 L197,200 L202,170 L207,150Z" fill="#0d1117" stroke="#1e40af" stroke-width="0.5" opacity="0.9"/>
  </g>
  <!-- Blue glow behind head -->
  <ellipse cx="256" cy="220" rx="100" ry="110" fill="#1e40af" opacity="0.06" filter="url(#hBlur)"/>
  <!-- Eyes - stern, focused -->
  <g filter="url(#hGlowF)">
    <rect x="220" y="208" width="26" height="8" rx="2" fill="#1e40af" opacity="0.8"/>
    <rect x="266" y="208" width="26" height="8" rx="2" fill="#1e40af" opacity="0.8"/>
    <rect x="230" y="210" width="6" height="4" rx="1" fill="#4a80ff"/>
    <rect x="276" y="210" width="6" height="4" rx="1" fill="#4a80ff"/>
  </g>
  <!-- Structured geometric lines on face -->
  <line x1="220" y1="250" x2="256" y2="265" stroke="#1e40af" stroke-width="0.5" opacity="0.2"/>
  <line x1="292" y1="250" x2="256" y2="265" stroke="#1e40af" stroke-width="0.5" opacity="0.2"/>
  <line x1="235" y1="280" x2="277" y2="280" stroke="#1e40af" stroke-width="0.5" opacity="0.2"/>
  <!-- Shoulder epaulettes hint -->
  <g opacity="0.2">
    <rect x="155" y="390" width="60" height="8" rx="2" fill="#1e40af"/>
    <rect x="297" y="390" width="60" height="8" rx="2" fill="#1e40af"/>
    <line x1="160" y1="400" x2="210" y2="400" stroke="#1e40af" stroke-width="1"/>
    <line x1="302" y1="400" x2="352" y2="400" stroke="#1e40af" stroke-width="1"/>
  </g>
  <!-- Horizontal grid lines -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="512" y2="100" stroke="#1e40af" stroke-width="1"/>
    <line x1="0" y1="160" x2="512" y2="160" stroke="#1e40af" stroke-width="1"/>
    <line x1="0" y1="220" x2="512" y2="220" stroke="#1e40af" stroke-width="1"/>
    <line x1="0" y1="280" x2="512" y2="280" stroke="#1e40af" stroke-width="1"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#1e40af" stroke-width="1"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="#1e40af" stroke-width="1"/>
  </g>
  <!-- Name -->
  <text x="256" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#1e40af" opacity="0.3" letter-spacing="4">SGT HARDEN</text>
</svg>