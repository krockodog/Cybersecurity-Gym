<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ckBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a1710"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <filter id="ckBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="ckGlowF">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ckCircle"><circle cx="256" cy="256" r="250"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#ckBg)"/>
  <!-- Network topology - nodes and connections radiating -->
  <g opacity="0.2" filter="url(#ckGlowF)" clip-path="url(#ckCircle)">
    <!-- Connection lines -->
    <line x1="80" y1="120" x2="160" y2="180" stroke="#059669" stroke-width="1"/>
    <line x1="160" y1="180" x2="256" y2="160" stroke="#059669" stroke-width="1"/>
    <line x1="256" y1="160" x2="350" y2="180" stroke="#059669" stroke-width="1"/>
    <line x1="350" y1="180" x2="430" y2="120" stroke="#059669" stroke-width="1"/>
    <line x1="160" y1="180" x2="120" y2="280" stroke="#059669" stroke-width="1"/>
    <line x1="350" y1="180" x2="390" y2="280" stroke="#059669" stroke-width="1"/>
    <line x1="120" y1="280" x2="180" y2="360" stroke="#059669" stroke-width="1"/>
    <line x1="390" y1="280" x2="340" y2="360" stroke="#059669" stroke-width="1"/>
    <line x1="80" y1="400" x2="180" y2="360" stroke="#059669" stroke-width="1"/>
    <line x1="430" y1="400" x2="340" y2="360" stroke="#059669" stroke-width="1"/>
    <line x1="256" y1="160" x2="256" y2="100" stroke="#059669" stroke-width="1"/>
    <!-- Packet dots traveling on lines -->
    <circle cx="120" cy="150" r="2" fill="#34d399"/>
    <circle cx="200" cy="170" r="2" fill="#34d399"/>
    <circle cx="310" cy="170" r="2" fill="#34d399"/>
    <circle cx="140" cy="230" r="2" fill="#34d399"/>
    <circle cx="370" cy="230" r="2" fill="#34d399"/>
  </g>
  <!-- Network nodes -->
  <g opacity="0.25">
    <circle cx="80" cy="120" r="6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="80" cy="120" r="2" fill="#059669"/>
    <circle cx="160" cy="180" r="8" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="160" cy="180" r="3" fill="#059669"/>
    <circle cx="350" cy="180" r="8" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="350" cy="180" r="3" fill="#059669"/>
    <circle cx="430" cy="120" r="6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="430" cy="120" r="2" fill="#059669"/>
    <circle cx="120" cy="280" r="6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="120" cy="280" r="2" fill="#059669"/>
    <circle cx="390" cy="280" r="6" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="390" cy="280" r="2" fill="#059669"/>
    <circle cx="80" cy="400" r="5" fill="none" stroke="#059669" stroke-width="1"/>
    <circle cx="80" cy="400" r="2" fill="#059669"/>
    <circle cx="430" cy="400" r="5" fill="none" stroke="#059669" stroke-width="1"/>
    <circle cx="430" cy="400" r="2" fill="#059669"/>
    <circle cx="256" cy="100" r="7" fill="none" stroke="#059669" stroke-width="1.5"/>
    <circle cx="256" cy="100" r="3" fill="#059669"/>
  </g>
  <!-- Head silhouette - female, technical -->
  <ellipse cx="256" cy="215" rx="95" ry="105" fill="#059669" opacity="0.06" filter="url(#ckBlur)"/>
  <g>
    <!-- Female silhouette with longer hair hint -->
    <path d="M256,110 Q215,110 200,140 Q188,165 185,195 L182,230 Q180,260 190,280 Q200,300 215,315 L225,340 Q222,370 218,395 L200,430 L175,460 L337,460 L312,430 L294,395 Q290,370 287,340 L297,315 Q312,300 322,280 Q332,260 330,230 L327,195 Q324,165 312,140 Q297,110 256,110Z" fill="#0d1117" stroke="#059669" stroke-width="0.5" opacity="0.9"/>
    <!-- Hair flowing on sides -->
    <path d="M200,140 Q185,150 175,180 Q168,210 172,240 Q175,255 180,260" fill="none" stroke="#0d1117" stroke-width="8"/>
    <path d="M312,140 Q327,150 337,180 Q344,210 340,240 Q337,255 332,260" fill="none" stroke="#0d1117" stroke-width="8"/>
  </g>
  <!-- Eyes - precise, technical -->
  <g filter="url(#ckGlowF)">
    <path d="M218,210 Q235,200 252,210 Q235,218 218,210Z" fill="#059669" opacity="0.8"/>
    <circle cx="237" cy="210" r="4" fill="#0a0e17"/>
    <circle cx="238" cy="209" r="1.5" fill="#34d399"/>
    <path d="M260,210 Q277,200 294,210 Q277,218 260,210Z" fill="#059669" opacity="0.8"/>
    <circle cx="275" cy="210" r="4" fill="#0a0e17"/>
    <circle cx="276" cy="209" r="1.5" fill="#34d399"/>
  </g>
  <!-- Network graph overlay on face -->
  <g opacity="0.12">
    <line x1="237" y1="210" x2="275" y2="210" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="256" y1="240" x2="237" y2="210" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,3"/>
    <line x1="256" y1="240" x2="275" y2="210" stroke="#059669" stroke-width="0.5" stroke-dasharray="2,3"/>
    <circle cx="256" cy="240" r="2" fill="#059669"/>
  </g>
  <!-- Scan lines -->
  <g opacity="0.04">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#059669" stroke-width="1"/>
    <line x1="0" y1="192" x2="512" y2="192" stroke="#059669" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#059669" stroke-width="1"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#059669" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#059669" stroke-width="1"/>
  </g>
  <!-- Name -->
  <text x="256" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#059669" opacity="0.3" letter-spacing="4">CISCO KATE</text>
</svg>